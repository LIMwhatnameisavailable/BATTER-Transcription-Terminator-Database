name: Deploy BTED Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing the JBrowse asset
        required: true
        default: v0.2.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v0.2.0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracked release and site
        run: |
          python3 scripts/validate_bted_v0_2.py
          python3 scripts/validate-site.py site
      - name: Download versioned JBrowse asset
        run: gh release download "$RELEASE_TAG" --pattern "BTED-v0.2.0-jbrowse-assets.tar.gz" --dir "$RUNNER_TEMP"
      - name: Stage Pages artifact
        run: |
          mkdir -p _site/jbrowse
          cp -R site/. _site/
          cp -R data/public/v0.2.0 _site/downloads
          python3 scripts/build_assembly_downloads.py --output-dir _site/downloads/assemblies
          tar -xzf "$RUNNER_TEMP/BTED-v0.2.0-jbrowse-assets.tar.gz" --strip-components=1 -C _site/jbrowse
          python3 scripts/validate_jbrowse_release.py _site/jbrowse
          python3 scripts/validate-site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
