name: BTED validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate templates
        run: python3 scripts/validate_bted_templates.py
      - name: Validate v0.1 compatibility snapshot
        run: python3 scripts/validate_bted_release.py
      - name: Validate v0.2 two-layer release
        run: |
          python3 scripts/validate_bted_v0_2.py
          python3 scripts/audit_v0_2_priority_sources.py
      - name: Validate generated site source
        run: python3 scripts/validate-site.py site
      - name: Run regression tests
        run: python3 -m unittest -v tests/test_bted_ingestion.py tests/test_bted_v0_2.py tests/test_accession_range_prototype.py
      - name: Check generated Python
        run: python3 -m py_compile scripts/build_v0_2_release.py scripts/build_v0_2_site.py scripts/build_jbrowse_release.py scripts/build_release_archives.py scripts/stage_pages.py scripts/run_accession_range_demo.py scripts/audit_v0_2_priority_sources.py scripts/validate_bted_v0_2.py scripts/validate_jbrowse_release.py
      - name: Check accession/Range prototype JavaScript
        run: |
          node --check prototype/accession-range/src/worker.js
          node --check site/assets/accession-range-demo.js
