services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bted}
      POSTGRES_USER: ${POSTGRES_USER:-bted}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bted-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BTED_DATABASE_URL: postgresql://${POSTGRES_USER:-bted}:${POSTGRES_PASSWORD:-bted-local-only}@db:5432/${POSTGRES_DB:-bted}
    ports:
      - "${BTED_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BTED_API_ORIGIN: ${BTED_API_ORIGIN:-http://backend:8000}
    environment:
      BTED_API_ORIGIN: ${BTED_API_ORIGIN:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
